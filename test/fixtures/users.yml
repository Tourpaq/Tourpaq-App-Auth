# Bound users have the fake identity provider's oid for their email (FakeIdentity.oid_for), so
# sign_in_as(user) is the same Entra account. Tenant: the test tenant.
<% tid = Rails.configuration.x.auth.entra_tenant_id %>
mwi:
  sub: 11111111-1111-4111-8111-111111111111
  email: mwi@tourpaq.com
  name: Mogens Winther
  upn: mwi@tourpaq.com
  entra_oid: <%= FakeIdentity.oid_for("mwi@tourpaq.com") %>
  entra_tid: <%= tid %>
  admin: true
  last_login_at: <%= 1.day.ago.to_fs(:db) %>

