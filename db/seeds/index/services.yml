# The NetBird network resources (additional_services.txt, October 2026), as
# cards. Resources in the grp_tp_hetzner_to_azure group use the
# netbird-hetzner access level; the rest had no group and use netbird.
#
# `address` is the NetBird resource itself. `url` is only set where there is a
# web UI to open. When an existing card already points at the same host, the
# importer adds the address to that card instead of making a second one.

- { name: Backup Control Plane, address: 10.50.1.10/32, category: Infrastructure, access: netbird,
    description: Control plane for the backups. }

- { name: GitLab, address: git.tourpaq.com, url: "https://git.tourpaq.com", category: DevOps, access: netbird,
    description: "Source code, merge requests and CI pipelines." }

