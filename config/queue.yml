# Solid Queue runs inside Puma (SOLID_QUEUE_IN_PUMA, SPECS.md §19): the jobs are small (cleanup,
# expiry reminders, heartbeat). DB_POOL must cover Puma's threads plus these.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 2
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
